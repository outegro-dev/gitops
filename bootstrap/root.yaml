# The only Application applied by hand (node/install-argocd.sh): it syncs
# every Application in applications/, and those sync the rest of the repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:outegro-dev/gitops.git
    targetRevision: master
    path: applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
