# Sealed Secrets controller (kube-system). Its private key is backed up by
# the owner; without it the sealed files in this repo cannot be decrypted.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.40.0/controller.yaml
