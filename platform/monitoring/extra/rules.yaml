# outegro.dev alerts on top of the chart's defaults (pods, nodes, Kubernetes).
# Thresholds are the specification's starting points (chapter 9.5); tune them
# after a baseline. Each alert names the service, the consequence and a runbook.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: outegro
  namespace: monitoring
spec:
  groups:
    - name: outegro.node
      rules:
        - alert: DiskFreeLow
          expr: |
            node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
              / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 0.20
          for: 15m
          labels:
            severity: warning
            service: node
          annotations:
            summary: Less than 20% disk left on the node ({{ $value | humanizePercentage }}).
            description: PostgreSQL, Loki and Prometheus share this disk; when it fills, writes stop.
            runbook_url: https://github.com/outegro-dev/platform/blob/master/docs/06-operations/resource-pressure.md
        - alert: DiskFreeCritical
          expr: |
            node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
              / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 0.10
          for: 5m
          labels:
            severity: critical
            service: node
          annotations:
            summary: Less than 10% disk left on the node ({{ $value | humanizePercentage }}).
            description: The database and the brokers are about to stop accepting writes.
            runbook_url: https://github.com/outegro-dev/platform/blob/master/docs/06-operations/resource-pressure.md
        - alert: MemoryPressure
          expr: rate(node_pressure_memory_waiting_seconds_total[5m]) > 0.10
          for: 10m
          labels:
            severity: critical
            service: node
          annotations:
            summary: Processes wait for memory {{ $value | humanizePercentage }} of the time.
            description: The node is short of memory; OOM kills and slow responses follow.
            runbook_url: https://github.com/outegro-dev/platform/blob/master/docs/06-operations/resource-pressure.md
        - alert: ServiceInSafeMode
          expr: max by (service) (safe_mode) == 1
          for: 30m
          labels:
            severity: warning
            service: "{{ $labels.service }}"
          annotations:
            summary: "{{ $labels.service }} runs with SAFE_MODE: it publishes, consumes and sends nothing."
            description: Expected only while a restore is being checked; remove SAFE_MODE and restart the service afterwards.
            runbook_url: https://github.com/outegro-dev/platform/blob/master/docs/06-operations/restore.md
        - alert: ContainerOOMKilled
          expr: |
            increase(kube_pod_container_status_restarts_total[15m]) > 0
            and on (namespace, pod, container)
            kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          labels:
            severity: warning
            service: "{{ $labels.namespace }}/{{ $labels.container }}"
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) was killed for exceeding its memory limit."
            description: The container restarted; requests it was serving failed.
            runbook_url: https://github.com/outegro-dev/platform/blob/master/docs/06-operations/resource-pressure.md

    - name: outegro.edge
      rules:
        - alert: EdgeErrorRate
          expr: |
            sum by (service) (rate(traefik_service_requests_total{code=~"5.."}[5m]))
              / sum by (service) (rate(traefik_service_requests_total[5m])) > 0.05
            and sum by (service) (rate(traefik_service_requests_total[5m])) > 0.05
          for: 10m
          labels:
            severity: warning
            service: "{{ $labels.service }}"
          annotations:
            summary: "{{ $labels.service }} answers {{ $value | humanizePercentage }} of requests with 5xx."
            description: Visitors see errors on this site.
            runbook_url: https://github.com/outegro-dev/platform/blob/master/docs/06-operations/release-rollback.md
        - alert: CertificateExpiresSoon
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 86400
          for: 1h
          labels:
            severity: warning
            service: cert-manager
          annotations:
            summary: Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}.
            description: Renewal is failing; Cloudflare stops reaching the origin when it expires (Full strict).
            runbook_url: https://github.com/outegro-dev/platform/blob/master/docs/06-operations/production.md

    - name: outegro.data
      rules:
        - alert: PostgresDown
          expr: cnpg_collector_up == 0 or absent(cnpg_collector_up)
          for: 3m
          labels:
            severity: critical
            service: postgres
          annotations:
            summary: PostgreSQL does not answer its metrics collector.
            description: Every service that stores data is failing.
            runbook_url: https://github.com/outegro-dev/platform/blob/master/docs/06-operations/restore.md
        - alert: PostgresBackupStale
          expr: time() - barman_cloud_cloudnative_pg_io_last_available_backup_timestamp > 26 * 3600
          for: 30m
          labels:
            severity: critical
            service: postgres
          annotations:
            summary: The last base backup in R2 is {{ $value | humanizeDuration }} old (daily is expected).
            description: A restore would lose more than the agreed recovery point.
            runbook_url: https://github.com/outegro-dev/platform/blob/master/docs/06-operations/restore.md
        # Time since the last archival is no signal: an idle database writes
        # no WAL, so nothing needs archiving. Segments that are complete but
        # still waiting for R2 are (archive_timeout is 5 minutes).
        - alert: PostgresWalArchiveBehind
          expr: max(cnpg_collector_pg_wal_archive_status{value="ready"}) > 3
          for: 15m
          labels:
            severity: warning
            service: postgres
          annotations:
            summary: "{{ $value }} WAL segments are waiting to be archived to R2."
            description: Point-in-time recovery would lose the writes in them, and they fill the node disk.
            runbook_url: https://github.com/outegro-dev/platform/blob/master/docs/06-operations/restore.md
        - alert: PostgresWalArchiveFailing
          expr: increase(cnpg_pg_stat_archiver_failed_count[30m]) > 0
          for: 30m
          labels:
            severity: warning
            service: postgres
          annotations:
            summary: WAL archiving to R2 keeps failing.
            description: WAL piles up on the node disk and recovery points age.
            runbook_url: https://github.com/outegro-dev/platform/blob/master/docs/06-operations/restore.md
        - alert: RabbitMQAlarm
          expr: max(rabbitmq_alarms_memory_used_watermark) + max(rabbitmq_alarms_free_disk_space_watermark) > 0
          for: 2m
          labels:
            severity: critical
            service: rabbitmq
          annotations:
            summary: RabbitMQ raised a memory or disk alarm and blocks publishers.
            description: Events stop flowing; outboxes grow in PostgreSQL until it clears.
            runbook_url: https://github.com/outegro-dev/platform/blob/master/docs/06-operations/resource-pressure.md
        - alert: DeadLetters
          expr: sum by (queue) (rabbitmq_detailed_queue_messages{queue=~".+\\.dlq"}) > 0
          for: 5m
          labels:
            severity: warning
            service: "{{ $labels.queue }}"
          annotations:
            summary: "{{ $value }} message(s) in the dead-letter queue {{ $labels.queue }}."
            description: An event failed every retry and was not processed; its effect is missing.
            runbook_url: https://github.com/outegro-dev/platform/blob/master/docs/06-operations/notification-incident.md

    - name: outegro.services
      rules:
        - alert: OutboxStuck
          expr: max by (service) (outbox_oldest_pending_age_seconds) > 300
          for: 5m
          labels:
            severity: warning
            service: "{{ $labels.service }}"
          annotations:
            summary: "{{ $labels.service }} has not published an event for {{ $value | humanizeDuration }}."
            description: Committed facts do not reach other services (access, messages, projections).
            runbook_url: https://github.com/outegro-dev/platform/blob/master/docs/06-operations/resource-pressure.md
        - alert: ServiceErrors
          expr: |
            sum by (service) (rate(http_server_requests_total{status_class="5xx"}[5m]))
              / sum by (service) (rate(http_server_requests_total[5m])) > 0.05
            and sum by (service) (rate(http_server_requests_total[5m])) > 0.02
          for: 10m
          labels:
            severity: warning
            service: "{{ $labels.service }}"
          annotations:
            summary: "{{ $labels.service }} answers {{ $value | humanizePercentage }} of requests with 5xx."
            description: Users of this service see errors.
            runbook_url: https://github.com/outegro-dev/platform/blob/master/docs/06-operations/release-rollback.md
        - alert: EventsDeadLettered
          expr: increase(messaging_events_consumed_total{outcome="dead_lettered"}[15m]) > 0
          labels:
            severity: warning
            service: "{{ $labels.service }}"
          annotations:
            summary: "{{ $labels.service }} dead-lettered events from {{ $labels.queue }}."
            description: An event failed every retry; its effect is missing until it is replayed.
            runbook_url: https://github.com/outegro-dev/platform/blob/master/docs/06-operations/notification-incident.md
        - alert: PaymentWebhooksStuck
          expr: max(payments_provider_event_oldest_unprocessed_age_seconds{status=~"received|failed"}) > 300
          for: 5m
          labels:
            severity: critical
            service: payments-backend
          annotations:
            summary: A Lava webhook accepted {{ $value | humanizeDuration }} ago is still not applied.
            description: A buyer paid and may not have access yet.
            runbook_url: https://github.com/outegro-dev/platform/blob/master/docs/06-operations/payment-incident.md
        - alert: PaymentWebhooksRejected
          expr: sum(increase(payments_webhooks_total{outcome=~"rejected_auth|rejected_schema|error"}[15m])) > 0
          labels:
            severity: warning
            service: payments-backend
          annotations:
            summary: Lava webhooks are being rejected or failing to store.
            description: Payments may not be recorded; Lava retries only for a while.
            runbook_url: https://github.com/outegro-dev/platform/blob/master/docs/06-operations/payment-incident.md
        - alert: PaymentReconciliationStale
          expr: |
            payments_reconciliation_last_success_timestamp_seconds > 0
            and time() - payments_reconciliation_last_success_timestamp_seconds > 900
          for: 5m
          labels:
            severity: warning
            service: payments-backend
          annotations:
            summary: Payment reconciliation has not completed for {{ $value | humanizeDuration }}.
            description: Lost Lava answers and missed webhooks are not being caught up.
            runbook_url: https://github.com/outegro-dev/platform/blob/master/docs/06-operations/payment-incident.md
        - alert: LoginCodesFailing
          expr: sum(increase(identity_login_codes_total{result="failed"}[10m])) > 0
          labels:
            severity: critical
            service: auth-backend
          annotations:
            summary: Sign-in codes are not being delivered.
            description: People cannot sign in with email.
            runbook_url: https://github.com/outegro-dev/platform/blob/master/docs/06-operations/notification-incident.md
        - alert: EmailQueueStuck
          expr: max(notifications_delivery_oldest_queued_age_seconds{channel="email"}) > 900
          for: 5m
          labels:
            severity: warning
            service: notifications-backend
          annotations:
            summary: An email has waited {{ $value | humanizeDuration }} to be sent.
            description: Messages arrive late (or the channel is paused on purpose in the admin console).
            runbook_url: https://github.com/outegro-dev/platform/blob/master/docs/06-operations/notification-incident.md
