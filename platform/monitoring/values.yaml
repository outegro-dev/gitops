# kube-prometheus-stack on the one 8 GB K3s node: Prometheus, node-exporter,
# kube-state-metrics and Grafana, with the chart's Kubernetes rules plus ours.
# Prometheus is not published (SSH tunnel). Grafana is served at
# admin.outegro.dev/grafana behind the admin console's sign-in: Traefik asks
# admin-web first (ForwardAuth, extra/grafana.yaml) and passes the operator's
# identity and role in X-WEBAUTH-* headers, which Grafana's auth proxy trusts
# only from Traefik (NetworkPolicy). Grafana has no local users or passwords.
# Firing alerts reach Telegram through the watchdog, which reads Prometheus'
# alerts API with the bot it already has; Alertmanager stays off.
fullnameOverride: monitoring
cleanPrometheusOperatorObjectNames: true

alertmanager:
  enabled: false

grafana:
  enabled: true
  testFramework:
    enabled: false
  # Grafana serves everything under /grafana, its metrics included.
  serviceMonitor:
    path: /grafana/metrics
  env:
    # Sign-in is only through the auth proxy; no built-in admin account.
    GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 320Mi
  sidecar:
    resources:
      requests:
        cpu: 5m
        memory: 48Mi
      limits:
        memory: 128Mi
    datasources:
      # Alertmanager is off (see the header).
      alertmanager:
        enabled: false
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki:3100
      jsonData:
        maxLines: 2000
  grafana.ini:
    server:
      root_url: https://admin.outegro.dev/grafana/
      serve_from_sub_path: true
    auth:
      disable_login_form: true
      disable_signout_menu: true
    auth.basic:
      enabled: false
    auth.anonymous:
      enabled: false
    auth.proxy:
      enabled: true
      header_name: X-WEBAUTH-USER
      header_property: username
      headers: "Email:X-WEBAUTH-EMAIL Name:X-WEBAUTH-NAME Role:X-WEBAUTH-ROLE"
      auto_sign_up: true
      enable_login_token: false
      # admin-web sends non-ASCII names quoted-printable.
      headers_encoded: true
    users:
      allow_sign_up: false
      allow_org_create: false
      auto_assign_org_role: Viewer
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
    news:
      news_feed_enabled: false

# K3s is one process: its API server endpoint also carries etcd and scheduler
# histograms, and the kubelet endpoint repeats all of it. Latency histograms no
# rule here reads are dropped (about 100k of the first 125k series).
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: (apiserver_request_duration_seconds|apiserver_request_sli_duration_seconds|apiserver_request_slo_duration_seconds|apiserver_request_body_size_bytes|apiserver_response_sizes|apiserver_watch_list_duration_seconds|apiserver_watch_cache_read_wait_seconds|apiserver_watch_events_sizes|etcd_request_duration_seconds|apiserver_admission_.+_duration_seconds|apiserver_flowcontrol_.+_seconds|workqueue_(queue|work)_duration_seconds|scheduler_.+_duration_seconds)_bucket
kubelet:
  serviceMonitor:
    # The kubelet's own metrics; everything else on that endpoint is the
    # rest of the k3s process, already scraped from the API server.
    metricRelabelings:
      - action: keep
        sourceLabels: [__name__]
        regex: (kubelet_.+|process_.+|go_goroutines|volume_manager_.+|storage_operation_.+|csi_operations_.+|prober_.+|rest_client_requests_total|kubernetes_build_info)
      - action: drop
        sourceLabels: [__name__, le]
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?

# K3s runs these inside the k3s process; their metrics are not reachable.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
kubeDns:
  enabled: false
windowsMonitoring:
  enabled: false

defaultRules:
  rules:
    alertmanager: false
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false
    windows: false
    # SLO burn-rate recordings are the most expensive rules; one API server
    # on one node has no SLO to burn.
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false
  disabled:
    # There is no Alertmanager on purpose (see the header).
    PrometheusNotConnectedToAlertmanagers: true
    PrometheusErrorSendingAlertsToAnyAlertmanager: true

prometheusOperator:
  # Rules are checked with promtool before commit; the webhook would need
  # certificate jobs that Argo CD re-runs on every sync.
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 192Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        memory: 48Mi

prometheus:
  prometheusSpec:
    scrapeInterval: 30s
    evaluationInterval: 30s
    retention: 7d
    retentionSize: 6GB
    walCompression: true
    # Every ServiceMonitor, PodMonitor and rule in the cluster, not only the chart's.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 64Mi
