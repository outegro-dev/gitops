---
# atelier.outegro.dev: everything goes to the web app; the backend stays inside
# the cluster (the BFF calls it with the owner's token).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atelier
  namespace: outegro
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - atelier.outegro.dev
      secretName: outegro-dev-tls
  rules:
    - host: atelier.outegro.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atelier-web
                port:
                  name: http
---
# cv.outegro.dev/<hash>/<file>.pdf: public CV links, served by atelier-backend
# under /cv. Nothing else of the backend is reachable on this host.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cv-prefix
  namespace: outegro
spec:
  addPrefix:
    prefix: /cv
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cv
  namespace: outegro
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: outegro-cv-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - cv.outegro.dev
      secretName: outegro-dev-tls
  rules:
    - host: cv.outegro.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atelier-backend
                port:
                  name: http
