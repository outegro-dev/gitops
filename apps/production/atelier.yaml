  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: atelier-browser
  template:
    metadata:
      labels:
        app: atelier-browser
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: atelier-browser
          image: outegro/atelier-browser
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_OPTIONS
              value: --max-old-space-size=160
            - name: LOG_LEVEL
              value: info
            - name: BROWSER_CONCURRENCY
              value: "1"
            - name: ATELIER_BROWSER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: atelier-internal
                  key: ATELIER_BROWSER_TOKEN
          ports:
            - name: http
