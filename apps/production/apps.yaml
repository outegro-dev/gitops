# Platform apps. Image tags live in kustomization.yaml (CI updates them).
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform
  namespace: outegro
data:
  AUTH_ISSUER: https://id.outegro.dev
  AUTH_AUDIENCE: outegro
  PUBLIC_WEB_URL: https://outegro.dev
  ACCOUNT_URL: https://id.outegro.dev
  SITE_URL: https://outegro.dev
  EMAIL_PROVIDER: resend
  EMAIL_FROM: Nick Lukashik <no-reply@outegro.dev>
  OAUTH_CLIENTS: >-
    [{"id":"pay-web","name":"Payments","redirectUris":["https://pay.outegro.dev/auth/callback"]},
    {"id":"admin-web","name":"Admin","redirectUris":["https://admin.outegro.dev/auth/callback"]},
    {"id":"battleship-web","name":"Battleship","redirectUris":["https://battleship.outegro.dev/auth/callback"]}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing-web
  namespace: outegro
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: landing-web
  template:
    metadata:
      labels:
        app: landing-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: landing-web
          image: outegro/landing-web
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_OPTIONS
              value: --max-old-space-size=192
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health/deep
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            # The image optimizer (sharp) decodes the 2x posters in memory.
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: id-web
  namespace: outegro
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: id-web
  template:
    metadata:
      labels:
        app: id-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: id-web
          image: outegro/id-web
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_OPTIONS
              value: --max-old-space-size=192
            - name: AUTH_API_URL
              value: http://auth-backend:4001
            - name: NOTIFICATIONS_API_URL
              value: http://notifications-backend:4002
            - name: SITE_URL
              valueFrom:
                configMapKeyRef:
                  name: platform
                  key: SITE_URL
            # Behind the Cloudflare proxy (deployment.md, "Адрес клиента").
            - name: CLIENT_IP_SOURCE
              value: cf-connecting-ip
          ports:
            - name: http
              containerPort: 3002
          readinessProbe:
            httpGet:
              path: /health/deep
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 320Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-backend
  namespace: outegro
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: auth-backend
  template:
    metadata:
      labels:
        app: auth-backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth-backend
          image: outegro/auth-backend
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: platform
          env:
            - name: NODE_OPTIONS
              value: --max-old-space-size=256
            - name: LOG_LEVEL
              value: info
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-auth
                  key: password
            - name: DATABASE_URL
              value: postgres://auth:$(DB_PASSWORD)@pg-rw:5432/auth
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey
                  key: password
            - name: VALKEY_URL
              value: redis://:$(VALKEY_PASSWORD)@valkey:6379/0
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: password
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672
            - name: NOTIFICATIONS_INTERNAL_URL
              value: http://notifications-backend:4002
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-internal
                  key: INTERNAL_API_TOKEN
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-signing
                  key: JWT_PRIVATE_KEY
            - name: LOGIN_CODE_PEPPER
              valueFrom:
                secretKeyRef:
                  name: auth-signing
                  key: LOGIN_CODE_PEPPER
            # Sign-in with Google (ID-02).
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: google-oauth
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-oauth
                  key: GOOGLE_CLIENT_SECRET
            - name: GOOGLE_REDIRECT_URI
              value: https://id.outegro.dev/login/google/callback
          ports:
            - name: http
              containerPort: 4001
            # Prometheus only; no Service or Ingress points at it.
            - name: metrics
              containerPort: 9464
          readinessProbe:
            httpGet:
              path: /health/deep
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-backend
  namespace: outegro
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: notifications-backend
  template:
    metadata:
      labels:
        app: notifications-backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notifications-backend
          image: outegro/notifications-backend
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: platform
          env:
            - name: NODE_OPTIONS
              value: --max-old-space-size=256
            - name: LOG_LEVEL
              value: info
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-notifications
                  key: password
            - name: DATABASE_URL
              value: postgres://notifications:$(DB_PASSWORD)@pg-rw:5432/notifications
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey
                  key: password
            - name: VALKEY_URL
              value: redis://:$(VALKEY_PASSWORD)@valkey:6379/1
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: password
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672
            - name: AUTH_JWKS_URL
              value: http://auth-backend:4001/.well-known/jwks.json
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-internal
                  key: INTERNAL_API_TOKEN
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: notifications-providers
                  key: RESEND_API_KEY
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: notifications-providers
                  key: TELEGRAM_BOT_TOKEN
            # Account linking (N-04): deep links to the bot, updates via hooks.
            - name: TELEGRAM_BOT_USERNAME
              value: outegro_dev_bot
            - name: TELEGRAM_WEBHOOK_URL
              value: https://hooks.outegro.dev/telegram
            - name: TELEGRAM_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: telegram-webhook
                  key: TELEGRAM_WEBHOOK_SECRET
          ports:
            - name: http
              containerPort: 4002
            # Prometheus only; no Service or Ingress points at it.
            - name: metrics
              containerPort: 9464
          readinessProbe:
            httpGet:
              path: /health/deep
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: landing-web
  namespace: outegro
spec:
  selector:
    app: landing-web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: id-web
  namespace: outegro
spec:
  selector:
    app: id-web
  ports:
    - name: http
      port: 3002
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: auth-backend
  namespace: outegro
spec:
  selector:
    app: auth-backend
  ports:
    - name: http
      port: 4001
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-backend
  namespace: outegro
spec:
  selector:
    app: notifications-backend
  ports:
    - name: http
      port: 4002
      targetPort: http
---
# Public hosts. www is redirected by Cloudflare; pay, admin and hooks have no
# apps yet and answer 404 at Traefik.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: outegro
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - outegro.dev
        - id.outegro.dev
      secretName: outegro-dev-tls
  rules:
    - host: outegro.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: landing-web
                port:
                  name: http
    - host: id.outegro.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: id-web
                port:
                  name: http
