# Everything in the outegro namespace. CI changes only the images block:
# one commit here is one production release, one revert is one rollback.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: outegro
resources:
  - namespace.yaml
  - priority-classes.yaml
  - secrets
  - certificate.yaml
  - postgres.yaml
  - valkey.yaml
  - rabbitmq.yaml
  - migrate.yaml
  - apps.yaml
  - payments.yaml
  - battleship.yaml
  # Education (edu.outegro.dev). Its PreSync migration needs the edu images
  # below, the pg-edu secret and the edu database (rollout step 1).
  - edu.yaml
  # Wallet (grumbles, ADR-011). Its PreSync migration needs the wallet image
  # below, the pg-wallet secret and the wallet database (wallet-rollout.md
  # in the platform repo, steps 0–2).
  - wallet.yaml
  # Roulette (ADR-012): its own Valkey from step 1; the apps and the PreSync
  # migration of its three databases switch on in step 3 of
  # docs/06-operations/roulette-rollout.md in the platform repo.
  - valkey-roulette.yaml
  # - roulette.yaml
  - pay.yaml
  - admin.yaml
  - hooks.yaml
  - watchdog.yaml
  - network-policies.yaml
images:
  - name: outegro/landing-web
    newTag: 13e466d43288@sha256:2740f5a254e3e2a1d2536f0b494339007b0f49150eb33ea4ea05f5cfce2c2fbd
    newName: ghcr.io/outegro-dev/landing-web
  - name: outegro/id-web
    newTag: 13e466d43288@sha256:9c1f508efc2f1eb2cea63e3a012657a65a2be56ef88d3bcf9b72a20bd417248f
    newName: ghcr.io/outegro-dev/id-web
  - name: outegro/auth-backend
    newTag: 13e466d43288@sha256:a942dd4af28b6314d8a5dcf65ae787109503d9abc60c2177dea4323084ce7674
    newName: ghcr.io/outegro-dev/auth-backend
  - name: outegro/notifications-backend
    newTag: 13e466d43288@sha256:02060d51862a4443a9dfc5a8dd416a9dc1d88fc5c8cdf7fd9d6b79bae03b33fc
    newName: ghcr.io/outegro-dev/notifications-backend
  - name: outegro/payments-backend
    newTag: 13e466d43288@sha256:79af4d016ee9edd56afe9833edadd57663640c69828c0a984fa4c03bae21b1eb
    newName: ghcr.io/outegro-dev/payments-backend
  - name: outegro/battleship-backend
    newTag: 13e466d43288@sha256:e9ca6f3e4f1429c2efe6ace41db72dd2d3ff892e6f587d995f504dc6d62e2a0a
    newName: ghcr.io/outegro-dev/battleship-backend
  - name: outegro/battleship-web
    newTag: 13e466d43288@sha256:2f66b3aa479d79d360bcc44e80e02e463228f6f1bd6e9d19571e1c68c183e8ef
    newName: ghcr.io/outegro-dev/battleship-web
  - name: outegro/pay-web
    newTag: 13e466d43288@sha256:f9c4849de91e488b96e007c4028fb0081bec784ff631ff2f7a705fcbf12d21e4
    newName: ghcr.io/outegro-dev/pay-web
  - name: outegro/admin-web
    newTag: 13e466d43288@sha256:e76093ff7938990d2bd4f1031ebea50a13be7240b004933b81eae6084312d971
    newName: ghcr.io/outegro-dev/admin-web
  # Education: CI writes <tag>@sha256 here on the first build that includes
  # the apps; until then nothing references these images.
  - name: outegro/edu-backend
    newTag: 13e466d43288@sha256:e3e00339f9971c885b8bc7c3d65ffdb75c37756a743383b4b4ee19b7e22209a8
    newName: ghcr.io/outegro-dev/edu-backend
  # Wallet: CI writes <tag>@sha256 here on the first build that includes
  # wallet-backend; until then nothing references this image.
  # Roulette: CI writes <tag>@sha256 here on the first build that includes
  # them; until then nothing references these images.
  - name: outegro/roulette-web
    newTag: pending
    newName: ghcr.io/outegro-dev/roulette-web
  - name: outegro/roulette-backend
    newTag: pending
    newName: ghcr.io/outegro-dev/roulette-backend
  - name: outegro/fair-roll-backend
    newTag: pending
    newName: ghcr.io/outegro-dev/fair-roll-backend
  - name: outegro/daily-bonus-backend
    newTag: pending
    newName: ghcr.io/outegro-dev/daily-bonus-backend
  - name: outegro/wallet-backend
    newTag: 13e466d43288@sha256:3256f26078c152ca4b7f53f889a698aef08fa8dc217305035df14249dba88679
    newName: ghcr.io/outegro-dev/wallet-backend
  - name: outegro/edu-web
    newTag: 13e466d43288@sha256:d2372fa18db0eb7bcc459820e874e632f861cacfb8456206a0e2e66cb3dc278f
    newName: ghcr.io/outegro-dev/edu-web
# Every service and stateful workload here runs as outegro-core (OPS-08).
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
