# Everything in the outegro namespace. CI changes only the images block:
# one commit here is one production release, one revert is one rollback.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: outegro
resources:
  - namespace.yaml
  - priority-classes.yaml
  - secrets
  - certificate.yaml
  - postgres.yaml
  - valkey.yaml
  - rabbitmq.yaml
  - migrate.yaml
  - apps.yaml
  - payments.yaml
  - battleship.yaml
  # Education (edu.outegro.dev). Its PreSync migration needs the edu images
  # below, the pg-edu secret and the edu database (rollout step 1).
  - edu.yaml
  - pay.yaml
  - admin.yaml
  - hooks.yaml
  - watchdog.yaml
  - network-policies.yaml
images:
  - name: outegro/landing-web
    newTag: b67487eff5cf@sha256:213a7385c7663f6b8506984faa864a4f22c20bd22539a2bb8635f140ad39775d
    newName: ghcr.io/outegro-dev/landing-web
  - name: outegro/id-web
    newTag: b67487eff5cf@sha256:d93603833052767c68c3d0e70df43c7c381fa8f684d71dddae84ae2d07e27979
    newName: ghcr.io/outegro-dev/id-web
  - name: outegro/auth-backend
    newTag: b67487eff5cf@sha256:d07f1d85abdbce442ab7e6185fbb9272146328cfb20a7a5d3c6ebd921b65ad8e
    newName: ghcr.io/outegro-dev/auth-backend
  - name: outegro/notifications-backend
    newTag: b67487eff5cf@sha256:a8d2da97ecdd310f22105fb651244b31be9b35a0c2c865733960308094a83669
    newName: ghcr.io/outegro-dev/notifications-backend
  - name: outegro/payments-backend
    newTag: b67487eff5cf@sha256:f494116612224c53ef8e74dc6ca9646d18d846eb6a38cd6a8348a62400e2a81f
    newName: ghcr.io/outegro-dev/payments-backend
  - name: outegro/battleship-backend
    newTag: b67487eff5cf@sha256:d699862306a84ab4d55a1f97a60fba691c957613fd34fa30bcf97cb654472bc9
    newName: ghcr.io/outegro-dev/battleship-backend
  - name: outegro/battleship-web
    newTag: b67487eff5cf@sha256:9dcd1583851bb9e0507ee1206d0eb76d9f6641ddbf56b29a5a255a158b9e78bd
    newName: ghcr.io/outegro-dev/battleship-web
  - name: outegro/pay-web
    newTag: b67487eff5cf@sha256:619fdc3cb09629d66a1ac76a6b2919f1ca1f03b339e55fedf4b0f0cb3ce2f225
    newName: ghcr.io/outegro-dev/pay-web
  - name: outegro/admin-web
    newTag: b67487eff5cf@sha256:4a1a01fea5a921471c20c344ed933031839358524ef8437229d3f870b4153fee
    newName: ghcr.io/outegro-dev/admin-web
  # Education: CI writes <tag>@sha256 here on the first build that includes
  # the apps; until then nothing references these images.
  - name: outegro/edu-backend
    newTag: b67487eff5cf@sha256:7976c7033712284cbf53e2f41a4c53351ac8208cfde9468c27daa163c0f11a1e
    newName: ghcr.io/outegro-dev/edu-backend
  - name: outegro/edu-web
    newTag: b67487eff5cf@sha256:c0b4912e3d264fc262e73bfc2567c8c94149e3d1cd7698f4bdc5ad35447e0d64
    newName: ghcr.io/outegro-dev/edu-web
# Every service and stateful workload here runs as outegro-core (OPS-08).
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
