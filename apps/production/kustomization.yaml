# Everything in the outegro namespace. CI changes only the images block:
# one commit here is one production release, one revert is one rollback.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: outegro
resources:
  - namespace.yaml
  - priority-classes.yaml
  - secrets
  - certificate.yaml
  - postgres.yaml
  - valkey.yaml
  - rabbitmq.yaml
  - migrate.yaml
  - apps.yaml
  - payments.yaml
  - battleship.yaml
  # Education (edu.outegro.dev). Its PreSync migration needs the edu images
  # below, the pg-edu secret and the edu database (rollout step 1).
  - edu.yaml
  # Wallet (grumbles, ADR-011). Its PreSync migration needs the wallet image
  # below, the pg-wallet secret and the wallet database: switched on in step
  # 3 of docs/06-operations/wallet-rollout.md in the platform repo.
  # - wallet.yaml
  - pay.yaml
  - admin.yaml
  - hooks.yaml
  - watchdog.yaml
  - network-policies.yaml
images:
  - name: outegro/landing-web
    newTag: a76b59c877dc@sha256:3cc9cedf1708605ce6a265d0711dba5514c330136420f6d3c813dbe554e5fe48
    newName: ghcr.io/outegro-dev/landing-web
  - name: outegro/id-web
    newTag: a76b59c877dc@sha256:c6ffe8cb35c1fb95c02124ad669ebe816c8214fe6b93f48e29390e336f564346
    newName: ghcr.io/outegro-dev/id-web
  - name: outegro/auth-backend
    newTag: a76b59c877dc@sha256:50b5078bdcf1e5c82c8e957f126c168ddf1286fe81654cdd985820702ed5efcc
    newName: ghcr.io/outegro-dev/auth-backend
  - name: outegro/notifications-backend
    newTag: a76b59c877dc@sha256:80a42914af8f9656e0af98ce9aa0b1b7b6a47151e67a7d4a246f17acf11de351
    newName: ghcr.io/outegro-dev/notifications-backend
  - name: outegro/payments-backend
    newTag: a76b59c877dc@sha256:28146645cbf2d51aa2122bb7c5956d7882ff683166c1aa52c21ee745ec20cdcd
    newName: ghcr.io/outegro-dev/payments-backend
  - name: outegro/battleship-backend
    newTag: a76b59c877dc@sha256:2ed7121662d8a770441f6542d4bda5762123dbd27ab74edfd4bcb7f8ddc0fb40
    newName: ghcr.io/outegro-dev/battleship-backend
  - name: outegro/battleship-web
    newTag: a76b59c877dc@sha256:33084fd51afa4a8795bd22122561bca75061098a52ba4e50e3e77f1c9835f4c5
    newName: ghcr.io/outegro-dev/battleship-web
  - name: outegro/pay-web
    newTag: a76b59c877dc@sha256:e98f8512ba87205359b177708ec253749b7f9b276f572790028a55538d19fbeb
    newName: ghcr.io/outegro-dev/pay-web
  - name: outegro/admin-web
    newTag: a76b59c877dc@sha256:b862ef6bcdcd9cafc9345fca99668a55a5e508c959ba891a82e13c0e7a2e2978
    newName: ghcr.io/outegro-dev/admin-web
  # Education: CI writes <tag>@sha256 here on the first build that includes
  # the apps; until then nothing references these images.
  - name: outegro/edu-backend
    newTag: a76b59c877dc@sha256:72b00747e546d20cf1bb2963ba52134c4d5600691f21bc4a5872de0f4d77b6bc
    newName: ghcr.io/outegro-dev/edu-backend
  # Wallet: CI writes <tag>@sha256 here on the first build that includes
  # wallet-backend; until then nothing references this image.
  - name: outegro/wallet-backend
    newTag: pending
    newName: ghcr.io/outegro-dev/wallet-backend
  - name: outegro/edu-web
    newTag: a76b59c877dc@sha256:a9a232f733f125bb9e52f1442d68233b8bbc394f4c4b8f030f392b27fba1ff9a
    newName: ghcr.io/outegro-dev/edu-web
# Every service and stateful workload here runs as outegro-core (OPS-08).
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
