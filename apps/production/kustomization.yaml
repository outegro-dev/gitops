# Everything in the outegro namespace. CI changes only the images block:
# one commit here is one production release, one revert is one rollback.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: outegro
resources:
  - namespace.yaml
  - priority-classes.yaml
  - secrets
  - certificate.yaml
  - postgres.yaml
  - valkey.yaml
  - rabbitmq.yaml
  - migrate.yaml
  - apps.yaml
  - payments.yaml
  - battleship.yaml
  # Education (edu.outegro.dev). Its PreSync migration needs the edu images
  # below, the pg-edu secret and the edu database (rollout step 1).
  - edu.yaml
  - pay.yaml
  - admin.yaml
  - hooks.yaml
  - watchdog.yaml
  - network-policies.yaml
images:
  - name: outegro/landing-web
    newTag: f5ef90dcda1a@sha256:c72b15f37a5e7f34c839479cbc2079ea0326ec0b855f18d41baba06a4ea7c080
    newName: ghcr.io/outegro-dev/landing-web
  - name: outegro/id-web
    newTag: f5ef90dcda1a@sha256:b603ac6cb6b8dcab0355ccb3eeb694c8b2facb693060b8ee2d3779dab3c3e860
    newName: ghcr.io/outegro-dev/id-web
  - name: outegro/auth-backend
    newTag: f5ef90dcda1a@sha256:90d68f998e0b2a13b6f10e316dd534536e20750d9a65524491e4d1d1727e8357
    newName: ghcr.io/outegro-dev/auth-backend
  - name: outegro/notifications-backend
    newTag: f5ef90dcda1a@sha256:463458106b76dd84884e7ab69e96f005f553587ba4c80eeaa5ab3f37e8ade02a
    newName: ghcr.io/outegro-dev/notifications-backend
  - name: outegro/payments-backend
    newTag: f5ef90dcda1a@sha256:847491eb2300e2ca3c215eef3cd742df89cdec980b00421e1e202bb9c494bdf8
    newName: ghcr.io/outegro-dev/payments-backend
  - name: outegro/battleship-backend
    newTag: f5ef90dcda1a@sha256:f1fdf98f24b494f0ddfea33e2a47d17cf078e0994a903381dfeb82b887816ccc
    newName: ghcr.io/outegro-dev/battleship-backend
  - name: outegro/battleship-web
    newTag: f5ef90dcda1a@sha256:d45e4186504610e8db2b9efc77cf1fc30dc09d87f4272aef42aaf9fa0264ff80
    newName: ghcr.io/outegro-dev/battleship-web
  - name: outegro/pay-web
    newTag: f5ef90dcda1a@sha256:5f67481084bf29fa30555d4b4f32e5016fa82bae52cf38b36d18943684c953d5
    newName: ghcr.io/outegro-dev/pay-web
  - name: outegro/admin-web
    newTag: f5ef90dcda1a@sha256:93931573ced06aa0c77b3a0f1da7887edfff8a82c4c5cc5ff4f2db8d3c9b42a9
    newName: ghcr.io/outegro-dev/admin-web
  # Education: CI writes <tag>@sha256 here on the first build that includes
  # the apps; until then nothing references these images.
  - name: outegro/edu-backend
    newTag: f5ef90dcda1a@sha256:233132ae6c6ddea8b26368602c7d15c3a7940c14111d218f8152fd14d009a39d
    newName: ghcr.io/outegro-dev/edu-backend
  - name: outegro/edu-web
    newTag: f5ef90dcda1a@sha256:45862c6f19a2c51a9fb9e0e75d657546f80bb9f694130ce0aefddd7344aab729
    newName: ghcr.io/outegro-dev/edu-web
# Every service and stateful workload here runs as outegro-core (OPS-08).
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
