# Everything in the outegro namespace. CI changes only the images block:
# one commit here is one production release, one revert is one rollback.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: outegro
resources:
  - namespace.yaml
  - priority-classes.yaml
  - secrets
  - certificate.yaml
  - postgres.yaml
  - valkey.yaml
  - rabbitmq.yaml
  - migrate.yaml
  - apps.yaml
  - payments.yaml
  - battleship.yaml
  # Education (edu.outegro.dev). Its PreSync migration needs the edu images
  # below, the pg-edu secret and the edu database (rollout step 1).
  - edu.yaml
  - pay.yaml
  - admin.yaml
  - hooks.yaml
  - watchdog.yaml
  - network-policies.yaml
images:
  - name: outegro/landing-web
    newTag: 39caba74ac46@sha256:7a86ebff1476612f8d0cc3cc95d9719e92a67d4625f8ffc95a5a690e91005a0f
    newName: ghcr.io/outegro-dev/landing-web
  - name: outegro/id-web
    newTag: 39caba74ac46@sha256:8a1b655e98d9404168eb00c9755cabb31f548d26a855bab813b1903b58075f72
    newName: ghcr.io/outegro-dev/id-web
  - name: outegro/auth-backend
    newTag: 39caba74ac46@sha256:c51527bae42e071565b6dc94637faa2b8354de0c0677b39c202a49a4d11a0458
    newName: ghcr.io/outegro-dev/auth-backend
  - name: outegro/notifications-backend
    newTag: 39caba74ac46@sha256:11645a1371f7dd9726ca567de4ca833a3517353c07a40023c0a452557e6fd3a7
    newName: ghcr.io/outegro-dev/notifications-backend
  - name: outegro/payments-backend
    newTag: 39caba74ac46@sha256:0c042695124548d65123e944b60aa3906887085b560409b95e6551caf12eecab
    newName: ghcr.io/outegro-dev/payments-backend
  - name: outegro/battleship-backend
    newTag: 39caba74ac46@sha256:e8c2187d8bd4ce0beb51a43a716cff3aeacd771e04999ec42e410da1483832ad
    newName: ghcr.io/outegro-dev/battleship-backend
  - name: outegro/battleship-web
    newTag: 39caba74ac46@sha256:93e6fbf87f5174000c46bc600d3a4e2638d677c51e5f44ad02f5777908fbd889
    newName: ghcr.io/outegro-dev/battleship-web
  - name: outegro/pay-web
    newTag: 39caba74ac46@sha256:5a7030ffcae5e38577dbd3ac1c36041b0620576afce750ef76378d1a7b491317
    newName: ghcr.io/outegro-dev/pay-web
  - name: outegro/admin-web
    newTag: 39caba74ac46@sha256:8bf1f194c8bd9be8bc8c68d27906115112c411bec88eb2f5e6c66943910e12e2
    newName: ghcr.io/outegro-dev/admin-web
  # Education: CI writes <tag>@sha256 here on the first build that includes
  # the apps; until then nothing references these images.
  - name: outegro/edu-backend
    newTag: 39caba74ac46@sha256:494f13e63d8505c4bd6e9c4bdf8530752059ac11d0989c18d6291dac509c2182
    newName: ghcr.io/outegro-dev/edu-backend
  - name: outegro/edu-web
    newTag: 39caba74ac46@sha256:96af77b6fbd7f3e3c9cf3ee8a45bdffb376b730b9057629b35a3b0ffb7da09a6
    newName: ghcr.io/outegro-dev/edu-web
# Every service and stateful workload here runs as outegro-core (OPS-08).
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
