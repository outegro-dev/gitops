# Everything in the outegro namespace. CI changes only the images block:
# one commit here is one production release, one revert is one rollback.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: outegro
resources:
  - namespace.yaml
  - priority-classes.yaml
  - secrets
  - certificate.yaml
  - postgres.yaml
  - valkey.yaml
  - rabbitmq.yaml
  - migrate.yaml
  - apps.yaml
  - payments.yaml
  - battleship.yaml
  # Education (edu.outegro.dev). Its PreSync migration needs the edu images
  # below, the pg-edu secret and the edu database (rollout step 1).
  - edu.yaml
  - pay.yaml
  - admin.yaml
  - hooks.yaml
  - watchdog.yaml
  - network-policies.yaml
images:
  - name: outegro/landing-web
    newTag: e83331622950@sha256:4fccb92446438277f4f75a0c58947b6c92951996f14f2140858aa866fbe40adb
    newName: ghcr.io/outegro-dev/landing-web
  - name: outegro/id-web
    newTag: e83331622950@sha256:53247dbe33329514e10f80df950b9cb08f513251a500e78a73b86ec1ac9d8e5a
    newName: ghcr.io/outegro-dev/id-web
  - name: outegro/auth-backend
    newTag: e83331622950@sha256:d84f646173e233d0a928554ed9ab7a8232bdda6a6de9e3b40fb98489cb9cf345
    newName: ghcr.io/outegro-dev/auth-backend
  - name: outegro/notifications-backend
    newTag: e83331622950@sha256:3e916925a4ac807ed8fbd7cfd2bee90c5ad48ac9916312280d076e983772d1c9
    newName: ghcr.io/outegro-dev/notifications-backend
  - name: outegro/payments-backend
    newTag: e83331622950@sha256:fe855978e6db8f3016953535a11d2863412f96ade3c9fff4fca38452bce41748
    newName: ghcr.io/outegro-dev/payments-backend
  - name: outegro/battleship-backend
    newTag: e83331622950@sha256:797fb94025af8ef9d522b65b53cd7fa1414a03e2e835874d628433d56b8885b3
    newName: ghcr.io/outegro-dev/battleship-backend
  - name: outegro/battleship-web
    newTag: e83331622950@sha256:efe21b28e05283dceda4125278a455b3ecdbd23907aabaa9c3f6f33fa78311d1
    newName: ghcr.io/outegro-dev/battleship-web
  - name: outegro/pay-web
    newTag: e83331622950@sha256:f891b2f723a68cc4ecd9e61073b35e9787b14144753be4a0de3216fe576d646f
    newName: ghcr.io/outegro-dev/pay-web
  - name: outegro/admin-web
    newTag: e83331622950@sha256:5cdfe7b832c8e6717f2100c00df6477757b1e8d3ec277a0d6849fccc33f9659a
    newName: ghcr.io/outegro-dev/admin-web
  # Education: CI writes <tag>@sha256 here on the first build that includes
  # the apps; until then nothing references these images.
  - name: outegro/edu-backend
    newTag: e83331622950@sha256:f353d5e9e91975f8eb9bc2bc26e3cfb5845c306f0c8255277fe9f0b93523816f
    newName: ghcr.io/outegro-dev/edu-backend
  - name: outegro/edu-web
    newTag: e83331622950@sha256:24eb91d5811176947a9978137155ebbfccd98b81d1186a8105a0110d88887226
    newName: ghcr.io/outegro-dev/edu-web
# Every service and stateful workload here runs as outegro-core (OPS-08).
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
