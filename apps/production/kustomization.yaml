# Every service and stateful workload here runs as outegro-core (OPS-08),
# except the heavy Atelier workers (Chromium, XeLaTeX, model CLIs): labelled
# outegro.dev/priority=agents, they rank with Hermes and are evicted first.
patches:
  - target:
      kind: Deployment
      labelSelector: outegro.dev/priority!=agents
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
  - target:
      kind: Deployment
      labelSelector: outegro.dev/priority=agents
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-agents
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
