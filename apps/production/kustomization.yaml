# Everything in the outegro namespace. CI changes only the images block:
# one commit here is one production release, one revert is one rollback.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: outegro
resources:
  - namespace.yaml
  - priority-classes.yaml
  - secrets
  - certificate.yaml
  - postgres.yaml
  - valkey.yaml
  - rabbitmq.yaml
  - migrate.yaml
  - apps.yaml
  - payments.yaml
  - battleship.yaml
  # Education (edu.outegro.dev). Its PreSync migration needs the edu images
  # below, the pg-edu secret and the edu database (rollout step 1).
  - edu.yaml
  - pay.yaml
  - admin.yaml
  - hooks.yaml
  - watchdog.yaml
  - network-policies.yaml
images:
  - name: outegro/landing-web
    newTag: 2478fdd27dc9@sha256:d1d392e5deea4b00061e3c005297dbc0014474d00c459f0991ee0afbac68e7cf
    newName: ghcr.io/outegro-dev/landing-web
  - name: outegro/id-web
    newTag: 2478fdd27dc9@sha256:673c7199b5e77594f7c9b2eaba844c43b99a770bfd66533bae4e7268830cb424
    newName: ghcr.io/outegro-dev/id-web
  - name: outegro/auth-backend
    newTag: 2478fdd27dc9@sha256:7fff030cf8f90051491688bb63ddd859b6bc469dd1c40908b59c1ed6e0d3233c
    newName: ghcr.io/outegro-dev/auth-backend
  - name: outegro/notifications-backend
    newTag: 2478fdd27dc9@sha256:a7d048c3bc765013320305953988f7c82f5ea24bf9ef11bd261f9d345b326263
    newName: ghcr.io/outegro-dev/notifications-backend
  - name: outegro/payments-backend
    newTag: 2478fdd27dc9@sha256:d8666e292c5a1ad0da6393560a20698af3e97997947713e76f7cf9dc2c0ccb60
    newName: ghcr.io/outegro-dev/payments-backend
  - name: outegro/battleship-backend
    newTag: 2478fdd27dc9@sha256:b241ea4a761f89e906c89821885ab299ebccb4a35133fbc0656d2d3cedbe8b20
    newName: ghcr.io/outegro-dev/battleship-backend
  - name: outegro/battleship-web
    newTag: 2478fdd27dc9@sha256:f472a3cde7db4e02056d504839e3e08e2326ef7c7bb953f3efcdb93f345b8617
    newName: ghcr.io/outegro-dev/battleship-web
  - name: outegro/pay-web
    newTag: 2478fdd27dc9@sha256:e8906c0584eb08fea67e19da30f9785933212708ed2c761023833fb6a5145f48
    newName: ghcr.io/outegro-dev/pay-web
  - name: outegro/admin-web
    newTag: 2478fdd27dc9@sha256:8b0171e275fb51374809727d112e2eb628a4bf509cc21632d6ddbfc35cc99f65
    newName: ghcr.io/outegro-dev/admin-web
  # Education: CI writes <tag>@sha256 here on the first build that includes
  # the apps; until then nothing references these images.
  - name: outegro/edu-backend
    newTag: 2478fdd27dc9@sha256:b8c22c060accb5ec4fc94e1311e6e41d5cf7b91bbda628bcc104bd29879fdbf9
    newName: ghcr.io/outegro-dev/edu-backend
  - name: outegro/edu-web
    newTag: 2478fdd27dc9@sha256:7bcbc7f4df5d73e4f5805e1c615c233732a7830f40e2aa687826ffa51f66f795
    newName: ghcr.io/outegro-dev/edu-web
# Every service and stateful workload here runs as outegro-core (OPS-08).
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
