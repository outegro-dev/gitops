# Everything in the outegro namespace. CI changes only the images block:
# one commit here is one production release, one revert is one rollback.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: outegro
resources:
  - namespace.yaml
  - priority-classes.yaml
  - secrets
  - certificate.yaml
  - postgres.yaml
  - valkey.yaml
  - rabbitmq.yaml
  - migrate.yaml
  - apps.yaml
  - payments.yaml
  - battleship.yaml
  # Education, runbook step 3: uncomment once CI has written the edu images
  # below, the pg-edu secret and the edu database exist (step 1) and the
  # Cloudflare record for edu.outegro.dev is in place. Its PreSync migration
  # would otherwise fail and hold every rollout of this app.
  # - edu.yaml
  - pay.yaml
  - admin.yaml
  - hooks.yaml
  - watchdog.yaml
  - network-policies.yaml
images:
  - name: outegro/landing-web
    newTag: 8fa0d0c7a476@sha256:d4e7ed1cb679dbbfd8c4666931ed8948d282d7f89707e31f98fa71212695169f
    newName: ghcr.io/outegro-dev/landing-web
  - name: outegro/id-web
    newTag: 8fa0d0c7a476@sha256:39d2323fc973019d3d0c2bf4cbf24451a0de108b3d6339daf247a24e4affbfd9
    newName: ghcr.io/outegro-dev/id-web
  - name: outegro/auth-backend
    newTag: 9923e50b5fa6@sha256:7800b333ccecbce23f6de35dc234a15a00af6063f596e77c0f0f61aa3a5302cd
    newName: ghcr.io/outegro-dev/auth-backend
  - name: outegro/notifications-backend
    newTag: 9923e50b5fa6@sha256:0bb928c731a928b3497edc542aa95117696d26709c537668608d7da2774d1edf
    newName: ghcr.io/outegro-dev/notifications-backend
  - name: outegro/payments-backend
    newTag: 9923e50b5fa6@sha256:78946720d37fba86e4bc5ff6231f90f41946943d4cb8c97da7a79da4cd715f92
    newName: ghcr.io/outegro-dev/payments-backend
  - name: outegro/battleship-backend
    newTag: 9923e50b5fa6@sha256:8fc84bf0a3535e10a819f0d1ca5b7cd98127248ced5e3af12b75cdfd4ae7cf0f
    newName: ghcr.io/outegro-dev/battleship-backend
  - name: outegro/battleship-web
    newTag: 8fa0d0c7a476@sha256:b0697b5601b47d1fb1e35d6372eb2c5deb6d855ee906f08546ed69d066ae86d1
    newName: ghcr.io/outegro-dev/battleship-web
  - name: outegro/pay-web
    newTag: 8fa0d0c7a476@sha256:8989c8afa1e15346b6960883a30fa694c7624cc73abd548de5beb9660d9ef090
    newName: ghcr.io/outegro-dev/pay-web
  - name: outegro/admin-web
    newTag: 8fa0d0c7a476@sha256:31b54917734e834e952f397302f6bebce2691568551c14b06d746421163d71a8
    newName: ghcr.io/outegro-dev/admin-web
  # Education: CI writes <tag>@sha256 here on the first build that includes
  # the apps; until then nothing references these images.
  - name: outegro/edu-backend
    newTag: pending
    newName: ghcr.io/outegro-dev/edu-backend
  - name: outegro/edu-web
    newTag: pending
    newName: ghcr.io/outegro-dev/edu-web
# Every service and stateful workload here runs as outegro-core (OPS-08).
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
