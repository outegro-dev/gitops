# Everything in the outegro namespace. CI changes only the images block:
# one commit here is one production release, one revert is one rollback.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: outegro
resources:
  - namespace.yaml
  - priority-classes.yaml
  - secrets
  - certificate.yaml
  - postgres.yaml
  - valkey.yaml
  - rabbitmq.yaml
  - migrate.yaml
  - apps.yaml
  - payments.yaml
  - battleship.yaml
  # Education (edu.outegro.dev). Its PreSync migration needs the edu images
  # below, the pg-edu secret and the edu database (rollout step 1).
  - edu.yaml
  - pay.yaml
  - admin.yaml
  - hooks.yaml
  - watchdog.yaml
  - network-policies.yaml
images:
  - name: outegro/landing-web
    newTag: b59ad81e4693@sha256:b746fb1a2e912f4b23270e3db188fc2d6d3886784ea30568cf3da9e564c14607
    newName: ghcr.io/outegro-dev/landing-web
  - name: outegro/id-web
    newTag: b59ad81e4693@sha256:3a7252cac7a261a79e4e0e57cd7b409dbcc2067dc4d0656a1e2d17e21928be28
    newName: ghcr.io/outegro-dev/id-web
  - name: outegro/auth-backend
    newTag: b59ad81e4693@sha256:f50cb455eb1fdb6ce7ee85f490699e42d4be4ad089507bb4794a42786d0f7e86
    newName: ghcr.io/outegro-dev/auth-backend
  - name: outegro/notifications-backend
    newTag: b59ad81e4693@sha256:da284fa0b33cebc9121f72fd985e59bb4f7045a01221eb77fed6c5a2108d4f2d
    newName: ghcr.io/outegro-dev/notifications-backend
  - name: outegro/payments-backend
    newTag: b59ad81e4693@sha256:bab2f2fc6d2a2d1ed8e227bfc7e6944238652dcb505fed45abcf55bf327a10fc
    newName: ghcr.io/outegro-dev/payments-backend
  - name: outegro/battleship-backend
    newTag: b59ad81e4693@sha256:ae9c43987b694d3c50dac51b89154ff94d733fe10afe9397766e66b321db1694
    newName: ghcr.io/outegro-dev/battleship-backend
  - name: outegro/battleship-web
    newTag: b59ad81e4693@sha256:ad613cf5882fe09aa861723dec6358e95a0787a6ceed327084f239e49f1ed4ec
    newName: ghcr.io/outegro-dev/battleship-web
  - name: outegro/pay-web
    newTag: b59ad81e4693@sha256:bdf157153c435596a5a963e5239288ccb212ced39e2a72c19ba78fea5de6d178
    newName: ghcr.io/outegro-dev/pay-web
  - name: outegro/admin-web
    newTag: b59ad81e4693@sha256:751441899109bde4ce29871b4a3965808106488154028e1cec17b5a64e7bac48
    newName: ghcr.io/outegro-dev/admin-web
  # Education: CI writes <tag>@sha256 here on the first build that includes
  # the apps; until then nothing references these images.
  - name: outegro/edu-backend
    newTag: 0301a4610056@sha256:4da7659bb24436daefb31e8798cc6f9b18deada42d6d3cb295a84fdffa49801d
    newName: ghcr.io/outegro-dev/edu-backend
  - name: outegro/edu-web
    newTag: 0301a4610056@sha256:e7607c9f0887c421f600f7aba9c2757d8d771899d07a4d818b3e02563925a9d7
    newName: ghcr.io/outegro-dev/edu-web
# Every service and stateful workload here runs as outegro-core (OPS-08).
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
