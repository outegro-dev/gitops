# Everything in the outegro namespace. CI changes only the images block:
# one commit here is one production release, one revert is one rollback.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: outegro
resources:
  - namespace.yaml
  - priority-classes.yaml
  - secrets
  - certificate.yaml
  - postgres.yaml
  - valkey.yaml
  - rabbitmq.yaml
  - migrate.yaml
  - apps.yaml
  - payments.yaml
  - battleship.yaml
  # Education (edu.outegro.dev). Its PreSync migration needs the edu images
  # below, the pg-edu secret and the edu database (rollout step 1).
  - edu.yaml
  - pay.yaml
  - admin.yaml
  - hooks.yaml
  - watchdog.yaml
  - network-policies.yaml
images:
  - name: outegro/landing-web
    newTag: cfd17d75e1ca@sha256:a7980ab1b36715a067a6ed0a1b53d0758137154d5cbb8d9ec5d1468175889b0e
    newName: ghcr.io/outegro-dev/landing-web
  - name: outegro/id-web
    newTag: cfd17d75e1ca@sha256:68373c657f4a3f94bf506aede361375b8861e5e9ade2255b7c5c82072065f118
    newName: ghcr.io/outegro-dev/id-web
  - name: outegro/auth-backend
    newTag: cfd17d75e1ca@sha256:ee3caa7d7447af7321bb3967177464b2b1151934c001d68617829137857b7220
    newName: ghcr.io/outegro-dev/auth-backend
  - name: outegro/notifications-backend
    newTag: cfd17d75e1ca@sha256:f8fc9c8a6c245534bfba3b155619eef6eb9172e4cd191ab1b80dce246a00f40e
    newName: ghcr.io/outegro-dev/notifications-backend
  - name: outegro/payments-backend
    newTag: cfd17d75e1ca@sha256:ab331591aaed5f482e6aff1228a38717e8c2b7a6666ff6aa403e5ae328d17f4c
    newName: ghcr.io/outegro-dev/payments-backend
  - name: outegro/battleship-backend
    newTag: cfd17d75e1ca@sha256:0e962ca8741e8136841e87064cb99b06306beb9282b65994666458042332441e
    newName: ghcr.io/outegro-dev/battleship-backend
  - name: outegro/battleship-web
    newTag: cfd17d75e1ca@sha256:54495f526c4d2cc4f58a047f1916415d369a5e25c6e89407ba7976816b3b657a
    newName: ghcr.io/outegro-dev/battleship-web
  - name: outegro/pay-web
    newTag: cfd17d75e1ca@sha256:bb45ae225fbd0842b165aea6ab925f488ce16369fd549ab9b994665528a127f2
    newName: ghcr.io/outegro-dev/pay-web
  - name: outegro/admin-web
    newTag: cfd17d75e1ca@sha256:12dbfb9890301f876ff6ce7ae9ad5fb080e47629241a1dad43caec4e84ebba44
    newName: ghcr.io/outegro-dev/admin-web
  # Education: CI writes <tag>@sha256 here on the first build that includes
  # the apps; until then nothing references these images.
  - name: outegro/edu-backend
    newTag: cfd17d75e1ca@sha256:aeccac6d08e7260d6f058639509ec45b35c554dd875a221a1e2b4849519edc65
    newName: ghcr.io/outegro-dev/edu-backend
  - name: outegro/edu-web
    newTag: cfd17d75e1ca@sha256:68dfffd00538ed7ccd665da47838f3a9013a19868458afeb604bfe3a707b0746
    newName: ghcr.io/outegro-dev/edu-web
# Every service and stateful workload here runs as outegro-core (OPS-08).
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
