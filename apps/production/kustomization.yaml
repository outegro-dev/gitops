# Everything in the outegro namespace. CI changes only the images block:
# one commit here is one production release, one revert is one rollback.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: outegro
resources:
  - namespace.yaml
  - priority-classes.yaml
  - secrets
  - certificate.yaml
  - postgres.yaml
  - valkey.yaml
  - rabbitmq.yaml
  - migrate.yaml
  - apps.yaml
  - payments.yaml
  - battleship.yaml
  # Education (edu.outegro.dev). Its PreSync migration needs the edu images
  # below, the pg-edu secret and the edu database (rollout step 1).
  - edu.yaml
  - pay.yaml
  - admin.yaml
  - hooks.yaml
  - watchdog.yaml
  - network-policies.yaml
images:
  - name: outegro/landing-web
    newTag: 50299762bd50@sha256:4bad04af74993b74056cc35e0d4e6112bb5c9fad98ef5126a44afa8a84558e33
    newName: ghcr.io/outegro-dev/landing-web
  - name: outegro/id-web
    newTag: 50299762bd50@sha256:d4c50b11f8f8180e5108113b43705b852097cbdc53583462cd46c279b8cc2db5
    newName: ghcr.io/outegro-dev/id-web
  - name: outegro/auth-backend
    newTag: 50299762bd50@sha256:58a1cab6bcc856df4c1b49cb3a12de50d88a45bb260354565c128297c6e2d38a
    newName: ghcr.io/outegro-dev/auth-backend
  - name: outegro/notifications-backend
    newTag: 50299762bd50@sha256:7e9184b93cb17211511900ecdc003b8a92fcca3269fc3982e9a9f2d117cf209d
    newName: ghcr.io/outegro-dev/notifications-backend
  - name: outegro/payments-backend
    newTag: 50299762bd50@sha256:02456724f0a049403d029fc24f418f70d41d061edc3a599afa7f2f4a5e4effdf
    newName: ghcr.io/outegro-dev/payments-backend
  - name: outegro/battleship-backend
    newTag: 50299762bd50@sha256:f83206289a912f0cc2a3521b445f6f139963546f8092196bc00d268a5c4c7d68
    newName: ghcr.io/outegro-dev/battleship-backend
  - name: outegro/battleship-web
    newTag: 50299762bd50@sha256:a0282c60cf64a2418deb8708b949ce7d3aa21bec4267a6c23ac651fafa006620
    newName: ghcr.io/outegro-dev/battleship-web
  - name: outegro/pay-web
    newTag: 50299762bd50@sha256:43b2c67c3b4251827f90833654a526d6ac3a577fcd049d8e5e407f8f7c9a4207
    newName: ghcr.io/outegro-dev/pay-web
  - name: outegro/admin-web
    newTag: 50299762bd50@sha256:692c1369b915e2c5bc9537f35a7ab4f70118b6612705f9cd58e212f5af9c95ff
    newName: ghcr.io/outegro-dev/admin-web
  # Education: CI writes <tag>@sha256 here on the first build that includes
  # the apps; until then nothing references these images.
  - name: outegro/edu-backend
    newTag: 50299762bd50@sha256:5f0ecf5b89c98e885f0fdb634cf62f845a50aa4ea195d65e43ec4145492938a5
    newName: ghcr.io/outegro-dev/edu-backend
  - name: outegro/edu-web
    newTag: 50299762bd50@sha256:e0a1290229ed5ab322f81f780f35df2081c031a64b19dfa21c7f0a5c7d477371
    newName: ghcr.io/outegro-dev/edu-web
# Every service and stateful workload here runs as outegro-core (OPS-08).
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
