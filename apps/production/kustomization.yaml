# Everything in the outegro namespace. CI changes only the images block:
# one commit here is one production release, one revert is one rollback.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: outegro
resources:
  - namespace.yaml
  - priority-classes.yaml
  - secrets
  - certificate.yaml
  - postgres.yaml
  - valkey.yaml
  - rabbitmq.yaml
  - migrate.yaml
  - apps.yaml
  - payments.yaml
  - battleship.yaml
  # Education (edu.outegro.dev). Its PreSync migration needs the edu images
  # below, the pg-edu secret and the edu database (rollout step 1).
  - edu.yaml
  - pay.yaml
  - admin.yaml
  - hooks.yaml
  - watchdog.yaml
  - network-policies.yaml
images:
  - name: outegro/landing-web
    newTag: e805a77f4a25@sha256:d9b35dd252dfc1c4462bd6aab8a22e35caf12a217ee5fe300e4a8920f1981795
    newName: ghcr.io/outegro-dev/landing-web
  - name: outegro/id-web
    newTag: e805a77f4a25@sha256:4263c100b87cec3c7fca6bafb32834c9d2b6d34e8213cf4fd7c91bc740e243ac
    newName: ghcr.io/outegro-dev/id-web
  - name: outegro/auth-backend
    newTag: e805a77f4a25@sha256:7b5affd5673cb82e0457bbd18260a9379a31997481998fa75962b72ff73ce1cf
    newName: ghcr.io/outegro-dev/auth-backend
  - name: outegro/notifications-backend
    newTag: e805a77f4a25@sha256:bda0a5ab2cdd05af7f9fb17f9bf8ba1ebe9e01a5a2000dfb6f55803eaa2cbdfb
    newName: ghcr.io/outegro-dev/notifications-backend
  - name: outegro/payments-backend
    newTag: e805a77f4a25@sha256:877b6537455da39c0685589d4280cc1346cbbdc8989cbb4d7e73baa42c68e3e1
    newName: ghcr.io/outegro-dev/payments-backend
  - name: outegro/battleship-backend
    newTag: e805a77f4a25@sha256:f9b6cb9b49c85a77dd9994f29a451804fa48c9d20f373f0bd877200e84d225e6
    newName: ghcr.io/outegro-dev/battleship-backend
  - name: outegro/battleship-web
    newTag: e805a77f4a25@sha256:50850a41d94a35ce800b3df90b12b4315dd519e46a88616145eafeefec930ce5
    newName: ghcr.io/outegro-dev/battleship-web
  - name: outegro/pay-web
    newTag: e805a77f4a25@sha256:89cf2d7c7cc6ec5f3a20afa5a51a2cd6893ffb5fc38b7d1ba19bede9933c8868
    newName: ghcr.io/outegro-dev/pay-web
  - name: outegro/admin-web
    newTag: e805a77f4a25@sha256:3842f42fd2395bb117ffde354043e1cb86b5d33defc8278407313fee9af352ac
    newName: ghcr.io/outegro-dev/admin-web
  # Education: CI writes <tag>@sha256 here on the first build that includes
  # the apps; until then nothing references these images.
  - name: outegro/edu-backend
    newTag: e805a77f4a25@sha256:03d618d76f6dc6c82b793b8f446a1d2b5caea7bfb5979c6b84b1243d72987a09
    newName: ghcr.io/outegro-dev/edu-backend
  - name: outegro/edu-web
    newTag: e805a77f4a25@sha256:18f5e70aa50817bb892ab9fe0ee2dc9f07d3d690d12b9aba31090c4a6a46f7c9
    newName: ghcr.io/outegro-dev/edu-web
# Every service and stateful workload here runs as outegro-core (OPS-08).
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
