# Everything in the outegro namespace. CI changes only the images block:
# one commit here is one production release, one revert is one rollback.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: outegro
resources:
  - namespace.yaml
  - priority-classes.yaml
  - secrets
  - certificate.yaml
  - postgres.yaml
  - valkey.yaml
  - rabbitmq.yaml
  - migrate.yaml
  - apps.yaml
  - payments.yaml
  - battleship.yaml
  - pay.yaml
  - admin.yaml
  - hooks.yaml
  - watchdog.yaml
  - network-policies.yaml
images:
  - name: outegro/landing-web
    newTag: 3f91685b1a63@sha256:57c19c32927e46449b01b50bebbe0ae48fdc75c2fe85b63d93417fd039613458
    newName: ghcr.io/outegro-dev/landing-web
  - name: outegro/id-web
    newTag: 3f91685b1a63@sha256:d9a585e190800fb64d68398c033e26a2e82eff7d3fadfcb980bb490389d03d23
    newName: ghcr.io/outegro-dev/id-web
  - name: outegro/auth-backend
    newTag: 3f91685b1a63@sha256:2c1b8281d0d265ac0b54c20623efe9f88119bea7c7f381e13e3cfd54dd475dec
    newName: ghcr.io/outegro-dev/auth-backend
  - name: outegro/notifications-backend
    newTag: 3f91685b1a63@sha256:a0774931962050cc58048561312ccb157becedf200cbdceec3d3cc1e1fd211bb
    newName: ghcr.io/outegro-dev/notifications-backend
  - name: outegro/payments-backend
    newTag: 3f91685b1a63@sha256:5394aa59b589244a476c5d5c259bdbdee773325b111553f9e37a1a5b281ddafd
    newName: ghcr.io/outegro-dev/payments-backend
  - name: outegro/battleship-backend
    newTag: 3f91685b1a63@sha256:054b2c87da42347e00899d5e36d8f3009ce97424e5cfd967a3d1f7c6aafd91f2
    newName: ghcr.io/outegro-dev/battleship-backend
  - name: outegro/battleship-web
    newTag: 3f91685b1a63@sha256:cf9342215973ecacea1445b772dc0891e12bc96586e3337c5bae3afb276236fe
    newName: ghcr.io/outegro-dev/battleship-web
  - name: outegro/pay-web
    newTag: 3f91685b1a63@sha256:9287d6dc6cd49834d29f6e140e65511e4d9391819b9ae3a7065ee0cc3ed1d699
    newName: ghcr.io/outegro-dev/pay-web
  - name: outegro/admin-web
    newTag: 3f91685b1a63@sha256:a61b72d5f7f98b2eb58c1a649e87a814bd987ff4543e834a02ded6a2b5e9f624
    newName: ghcr.io/outegro-dev/admin-web
# Every service and stateful workload here runs as outegro-core (OPS-08).
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
