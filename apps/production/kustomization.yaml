# Everything in the outegro namespace. CI changes only the images block:
# one commit here is one production release, one revert is one rollback.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: outegro
resources:
  - namespace.yaml
  - priority-classes.yaml
  - secrets
  - certificate.yaml
  - postgres.yaml
  - valkey.yaml
  - rabbitmq.yaml
  - migrate.yaml
  - apps.yaml
  - payments.yaml
  - battleship.yaml
  # Education (edu.outegro.dev). Its PreSync migration needs the edu images
  # below, the pg-edu secret and the edu database (rollout step 1).
  - edu.yaml
  # Wallet (grumbles, ADR-011). Its PreSync migration needs the wallet image
  # below, the pg-wallet secret and the wallet database (wallet-rollout.md
  # in the platform repo, steps 0–2).
  - wallet.yaml
  # Roulette (ADR-012): its own Valkey from step 1; the apps and the PreSync
  # migration of its three databases from step 3 of
  # docs/06-operations/roulette-rollout.md in the platform repo (season 1).
  - valkey-roulette.yaml
  - roulette.yaml
  # Atelier (atelier.outegro.dev, cv.outegro.dev). Its PreSync migration needs
  # the atelier images below, the pg-atelier secret and the atelier database.
  - atelier.yaml
  - pay.yaml
  - admin.yaml
  - hooks.yaml
  - watchdog.yaml
  - network-policies.yaml
images:
