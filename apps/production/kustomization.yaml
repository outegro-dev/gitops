# Everything in the outegro namespace. CI changes only the images block:
# one commit here is one production release, one revert is one rollback.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: outegro
resources:
  - namespace.yaml
  - priority-classes.yaml
  - secrets
  - certificate.yaml
  - postgres.yaml
  - valkey.yaml
  - rabbitmq.yaml
  - migrate.yaml
  - apps.yaml
  - payments.yaml
  - battleship.yaml
  # Education (edu.outegro.dev). Its PreSync migration needs the edu images
  # below, the pg-edu secret and the edu database (rollout step 1).
  - edu.yaml
  - pay.yaml
  - admin.yaml
  - hooks.yaml
  - watchdog.yaml
  - network-policies.yaml
images:
  - name: outegro/landing-web
    newTag: 843fa6e40de5@sha256:47269bdd3ca78e16b6a83e908822d1c4730b1f7531fdee1a6eecada761b66d36
    newName: ghcr.io/outegro-dev/landing-web
  - name: outegro/id-web
    newTag: 843fa6e40de5@sha256:65a56fdbee2b811c51e49780dff0c5fa770cce19339b524240aaa86e0071cfb7
    newName: ghcr.io/outegro-dev/id-web
  - name: outegro/auth-backend
    newTag: 843fa6e40de5@sha256:7e02d7a57917ada7a4d83323db11240d16b93a4fcf3c6f35ddab4c69e81e700f
    newName: ghcr.io/outegro-dev/auth-backend
  - name: outegro/notifications-backend
    newTag: 843fa6e40de5@sha256:5e48ffaf1d1196a6d2d4d7f2298d371087d7ff082f28b9c7234c339864323c2a
    newName: ghcr.io/outegro-dev/notifications-backend
  - name: outegro/payments-backend
    newTag: 843fa6e40de5@sha256:aa962a062036df4ba88cc941f6edcb9185d83a44f92220d496a5f112287699f0
    newName: ghcr.io/outegro-dev/payments-backend
  - name: outegro/battleship-backend
    newTag: 843fa6e40de5@sha256:35cf5b863cdaa869b99cdae44864f33e51ea11383c7f9294ff943a995c5d7fae
    newName: ghcr.io/outegro-dev/battleship-backend
  - name: outegro/battleship-web
    newTag: 843fa6e40de5@sha256:642ced9501016c81775cd4d8625e1c61e6f00574209fbba9c57af192d0073a02
    newName: ghcr.io/outegro-dev/battleship-web
  - name: outegro/pay-web
    newTag: 843fa6e40de5@sha256:354f1b351a50b995e5aab412859995f87454fffa129b43c78a75c789314f960a
    newName: ghcr.io/outegro-dev/pay-web
  - name: outegro/admin-web
    newTag: 843fa6e40de5@sha256:86e39c0093333241d9f0c048193a49a6ebe876d32ea7cbb38198185abe8e41f1
    newName: ghcr.io/outegro-dev/admin-web
  # Education: CI writes <tag>@sha256 here on the first build that includes
  # the apps; until then nothing references these images.
  - name: outegro/edu-backend
    newTag: 843fa6e40de5@sha256:8857da6ba7c64975a47ba507f3b8ed5a4e7a0387cf7cf01fdf86c3b0403a4523
    newName: ghcr.io/outegro-dev/edu-backend
  - name: outegro/edu-web
    newTag: 843fa6e40de5@sha256:e1efe4717926febdcd01072536fc600047ec3aa257733612881945356a8eec50
    newName: ghcr.io/outegro-dev/edu-web
# Every service and stateful workload here runs as outegro-core (OPS-08).
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: outegro-core
