# Provider webhooks on hooks.outegro.dev. Public paths are short
# (/telegram, /lava); services serve them under /webhooks/<provider>.
# Each path is exact: nothing else on this host reaches a service.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: webhooks-prefix
  namespace: outegro
spec:
  addPrefix:
    prefix: /webhooks
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hooks
  namespace: outegro
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: outegro-webhooks-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - hooks.outegro.dev
      secretName: outegro-dev-tls
  rules:
    - host: hooks.outegro.dev
      http:
        paths:
          - path: /telegram
            pathType: Exact
            backend:
              service:
                name: notifications-backend
                port:
                  name: http
