# Restore drill (OPS-07): a throwaway PostgreSQL rebuilt only from what is in
# R2 — the latest base backup plus archived WAL. It never archives (no plugin
# for it), so the backup chain of `pg` stays untouched, and no app connects
# to it. Checked against `pg`, then removed from git (Argo deletes it).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-drill
  namespace: outegro
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-202609281634-standard-trixie
  storage:
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
  bootstrap:
    recovery:
      source: pg-in-r2
  externalClusters:
    - name: pg-in-r2
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: r2
          serverName: pg
