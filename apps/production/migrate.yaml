# Migrations run as Argo CD PreSync hooks: every sync migrates before the
# new version rolls out. They get the database URL and nothing else.
apiVersion: batch/v1
kind: Job
metadata:
  name: auth-migrate
  namespace: outegro
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: outegro/auth-backend
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/db/migrate.js"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-auth
                  key: password
            - name: DATABASE_URL
              value: postgres://auth:$(DB_PASSWORD)@pg-rw:5432/auth
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
