# RabbitMQ 4 broker for platform events. One node, so a StatefulSet with a
# stable hostname and a volume is enough; the management UI stays internal.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq
  namespace: outegro
data:
  20-outegro.conf: |
    vm_memory_high_watermark.absolute = 400MiB
    disk_free_limit.absolute = 1GB
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: outegro
  labels:
    app: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
    - name: management
      port: 15672
    # The built-in Prometheus plugin; scraped by the monitoring app.
    - name: prometheus
      port: 15692
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: outegro
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        # Without this the kubelet re-applies fsGroup to every file on each
        # mount, the Erlang cookie becomes group-readable and RabbitMQ refuses
        # to start ("must be accessible by owner only"): every restart after
        # the first failed (02.10.2026).
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Repairs a cookie whose mode an earlier mount already changed.
        - name: cookie-mode
          image: rabbitmq:4.3-management-alpine
          command:
            - sh
            - -c
            - "[ ! -f /var/lib/rabbitmq/.erlang.cookie ] || chmod 400 /var/lib/rabbitmq/.erlang.cookie"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3-management-alpine
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: password
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          readinessProbe:
            tcpSocket:
              port: amqp
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: config
              mountPath: /etc/rabbitmq/conf.d/20-outegro.conf
              subPath: 20-outegro.conf
      volumes:
        - name: config
          configMap:
            name: rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
