apiVersion: apps/v1
kind: Deployment
metadata:
  name: roulette-web
  namespace: outegro
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: roulette-web
  template:
    metadata:
      labels:
        app: roulette-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: roulette-web
          image: outegro/roulette-web
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_OPTIONS
              value: --max-old-space-size=192
            - name: ROULETTE_API_URL
              value: http://roulette-backend:4006
            - name: GAME_WS_URL
              value: wss://roulette.outegro.dev
            - name: WALLET_API_URL
              value: http://wallet-backend:4007
            - name: DAILY_API_URL
              value: http://daily-bonus-backend:4101
            - name: AUTH_API_URL
              value: http://auth-backend:4001
            - name: ID_URL
              value: https://id.outegro.dev
            - name: APP_URL
              value: https://roulette.outegro.dev
            - name: SITE_URL
              valueFrom:
                configMapKeyRef:
                  name: platform
                  key: SITE_URL
            - name: PAY_URL
              value: https://pay.outegro.dev
            - name: EDU_URL
              value: https://edu.outegro.dev
            - name: BATTLESHIP_URL
              value: https://battleship.outegro.dev
            - name: ADMIN_URL
              value: https://admin.outegro.dev
            - name: CLIENT_IP_SOURCE
              value: cf-connecting-ip
          ports:
            - name: http
              containerPort: 3007
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 320Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: roulette-web
  namespace: outegro
spec:
  selector:
    app: roulette-web
  ports:
    - name: http
      port: 3007
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: roulette
  namespace: outegro
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - roulette.outegro.dev
      secretName: outegro-dev-tls
  rules:
    - host: roulette.outegro.dev
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: roulette-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: roulette-web
                port:
                  name: http
