# Roulette at roulette.outegro.dev (ADR-012 in the platform repo):
# fair-roll-backend (the seed chain, internal only), roulette-backend (rounds,
# bets, the game socket), daily-bonus-backend (the bonus of the day) and the
# web app. Stakes are grumbles from wallet-backend, so the wallet runs first.
# Switched on in step 3 of docs/06-operations/roulette-rollout.md.
apiVersion: batch/v1
kind: Job
metadata:
  name: roulette-migrate
  namespace: outegro
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: roulette
          image: outegro/roulette-backend
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/db/migrate.js"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-roulette
                  key: password
            - name: DATABASE_URL
              value: postgres://roulette:$(DB_PASSWORD)@pg-rw:5432/roulette
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        - name: fair-roll
          image: outegro/fair-roll-backend
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/db/migrate.js"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-fair-roll
                  key: password
            - name: DATABASE_URL
              value: postgres://fair_roll:$(DB_PASSWORD)@pg-rw:5432/fair_roll
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        - name: daily
          image: outegro/daily-bonus-backend
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/db/migrate.js"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-daily
                  key: password
            - name: DATABASE_URL
              value: postgres://daily:$(DB_PASSWORD)@pg-rw:5432/daily
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fair-roll-backend
  namespace: outegro
spec:
  replicas: 1
  # One holder of the root at a time; reveals are serialised in Postgres anyway.
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: fair-roll-backend
  template:
    metadata:
      labels:
        app: fair-roll-backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fair-roll-backend
          image: outegro/fair-roll-backend
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_OPTIONS
              value: --max-old-space-size=128
            - name: LOG_LEVEL
              value: info
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-fair-roll
                  key: password
            - name: DATABASE_URL
              value: postgres://fair_roll:$(DB_PASSWORD)@pg-rw:5432/fair_roll
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-internal
                  key: INTERNAL_API_TOKEN
            - name: FAIR_ROLL_ROOT
              valueFrom:
                secretKeyRef:
                  name: fair-roll
                  key: FAIR_ROLL_ROOT
            - name: FAIR_ROLL_CHAIN_LENGTH
              value: "1000000"
            # The randomness of the drand round announced with the season's
            # commit, set in step 3 once that round has happened. Without it
            # the pod does not start and nothing is recorded; once recorded
            # it can never change for this chain.
            # Season 1 (docs/06-operations/roulette-seasons.md in the platform repo).
            - name: FAIR_ROLL_PUBLIC_SEED
              value: drand-quicknet:33460746:5c5fc64b250abd3b015521697230b2faf4d8bb6c95241507c36a8eb59497a27a
          ports:
            - name: http
              containerPort: 4100
            - name: metrics
              containerPort: 9464
          readinessProbe:
            httpGet:
              path: /health/deep
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            # Building the chain takes a couple of seconds at start.
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: fair-roll-backend
  namespace: outegro
spec:
  selector:
    app: fair-roll-backend
  ports:
    - name: http
      port: 4100
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roulette-backend
  namespace: outegro
spec:
  # The engine runs on whichever replica holds the lease; one is enough.
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: roulette-backend
  template:
    metadata:
      labels:
        app: roulette-backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: roulette-backend
          image: outegro/roulette-backend
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: platform
          env:
            - name: NODE_OPTIONS
              value: --max-old-space-size=256
            - name: LOG_LEVEL
              value: info
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-roulette
                  key: password
            - name: DATABASE_URL
              value: postgres://roulette:$(DB_PASSWORD)@pg-rw:5432/roulette
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-roulette
                  key: password
            - name: VALKEY_URL
              value: redis://:$(VALKEY_PASSWORD)@valkey-roulette:6379/0
            - name: AUTH_JWKS_URL
              value: http://auth-backend:4001/.well-known/jwks.json
            - name: AUTH_INTERNAL_URL
              value: http://auth-backend:4001
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-internal
                  key: INTERNAL_API_TOKEN
            - name: FAIR_ROLL_URL
              value: http://fair-roll-backend:4100
            - name: DAILY_BONUS_URL
              value: http://daily-bonus-backend:4101
            # Real grumbles: the service refuses to start in production without these.
            - name: WALLET_MODE
              value: http
            - name: WALLET_URL
              value: http://wallet-backend:4007
            - name: WS_ALLOWED_ORIGINS
              value: https://roulette.outegro.dev
          ports:
            - name: http
              containerPort: 4006
            - name: metrics
              containerPort: 9464
          readinessProbe:
            httpGet:
              path: /health/deep
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: roulette-backend
  namespace: outegro
spec:
  selector:
    app: roulette-backend
  ports:
    - name: http
      port: 4006
      targetPort: http
---
