# Hermes Agent (chapter 11): owner-only assistant on the ChatGPT subscription.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agents
resources:
  - namespace.yaml
  - secrets
  - hermes.yaml
  - network-policy.yaml
images:
  # v2026.9.24, pinned by digest: an upstream re-tag does not change the pod.
  - name: nousresearch/hermes-agent
    digest: sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
# Managed policy (tools, model route, chat gates); a change rolls the pod.
configMapGenerator:
  - name: hermes-policy
    files:
      - config.yaml=hermes-policy/config.yaml
      - .env=hermes-policy/env
